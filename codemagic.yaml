# Throwaway macOS VM for a manual GUI test: opens VNC (password from VNC_PW) through a Cloudflare
# quick tunnel (websockify in front of :5900), prints the tunnel URL, then waits until cancelled.
workflows:
  mac-gui:
    name: mac-gui
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: open VNC through a tunnel
        script: |
          sw_vers; whoami; who
          # login password for the GUI (VNC shows the login window) + SSH for staging (throwaway key)
          sudo dscl . -passwd /Users/builder "$VNC_PW" && echo PW_SET
          mkdir -p ~/.ssh && echo "$SSH_PUB" >> ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null; sudo launchctl enable system/com.openssh.sshd; sudo launchctl kickstart system/com.openssh.sshd 2>/dev/null
          sleep 2; nc -z 127.0.0.1 22 && echo SSH_UP
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PW" \
            -restart -agent -privs -all -allowAccessFor -allUsers >/dev/null 2>&1 || true
          sudo launchctl enable system/com.apple.screensharing; sudo launchctl kickstart -k system/com.apple.screensharing || true
          sleep 3; nc -z 127.0.0.1 5900 && echo VNC_UP
          python3 -m pip install --user -q websockify 2>&1 | tail -1
          curl -fsSL -o /tmp/cf.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz && tar -xzf /tmp/cf.tgz -C /tmp
          for pair in 6080:5900 6022:22; do
            (python3 -m websockify ${pair%%:*} 127.0.0.1:${pair##*:} > /tmp/wsk-${pair##*:}.log 2>&1 &)
            (/tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:${pair%%:*} > /tmp/cf-${pair##*:}.log 2>&1 &)
          done
          for port in 5900 22; do
            for i in $(seq 40); do u=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf-$port.log | head -1); [ -n "$u" ] && break; sleep 2; done
            echo "TUNNEL_$port=$u"
          done
      - name: wait (cancel the build when done)
        script: |
          for i in $(seq 55); do sleep 60; echo "alive $i"; done

  # Developer ID signing + notarization smoke test: tiny C app -> codesign -> signed component pkg
  # -> notarytool (ASC API key) -> staple -> spctl. Secrets come only from the app-level secure
  # variable group mac_signing and the KhalZC_ASC_Key App Store Connect integration.
  mac-sign-test:
    name: mac-sign-test
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: KhalZC_ASC_Key   # -> APP_STORE_CONNECT_{PRIVATE_KEY,KEY_IDENTIFIER,ISSUER_ID}
    environment:
      groups: [mac_signing]               # DEVID_APP_P12_B64, DEVID_INSTALLER_P12_B64, DEVID_P12_PASS
      vars:
        TEAM: B64X7H65W6
        PKG_ID: com.frondesk.signtest
    scripts:
      - name: keychain
        script: |
          set -euo pipefail
          # own temp keychain (not `keychain add-certificates`: its key ACL only allows codesign, so pkgbuild
          # fails with errSecInteractionNotAllowed). Partition list apple-tool:,apple: covers codesign + pkgbuild.
          KC=$HOME/Library/Keychains/devid-signing.keychain-db; KP=$(uuidgen)
          security create-keychain -p "$KP" $KC; security set-keychain-settings $KC; security unlock-keychain -p "$KP" $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"'); security default-keychain -d user -s $KC
          for t in APP INSTALLER; do v=DEVID_${t}_P12_B64
            printf '%s' "${!v}" | base64 -D > /tmp/$t.p12
            security import /tmp/$t.p12 -k $KC -f pkcs12 -P "$DEVID_P12_PASS" \
              -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/productsign
            rm -f /tmp/$t.p12; done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" $KC >/dev/null
          # the Developer ID G2 intermediate isn't on the build image; without it the identities aren't valid
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/DeveloperIDG2CA.cer -k $KC
          security find-identity -v -p codesigning $KC | grep 'Developer ID Application'
          security find-identity -v -p basic $KC | grep 'Developer ID Installer'
      - name: build + sign app and pkg
        script: |
          set -euo pipefail
          APP_ID="Developer ID Application: Jacob Turetsky ($TEAM)"; INS_ID="Developer ID Installer: Jacob Turetsky ($TEAM)"
          A=root/Applications/FrondeskSignTest.app; mkdir -p $A/Contents/MacOS out
          printf '#include <stdio.h>\nint main(void){puts("hello from FrondeskSignTest");return 0;}\n' > hello.c
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=12.0 -O2 -o $A/Contents/MacOS/FrondeskSignTest hello.c
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $PKG_ID" -c 'Add :CFBundleName string FrondeskSignTest' \
            -c 'Add :CFBundleExecutable string FrondeskSignTest' -c 'Add :CFBundlePackageType string APPL' \
            -c "Add :CFBundleShortVersionString string 1.0.$BUILD_NUMBER" -c "Add :CFBundleVersion string $BUILD_NUMBER" \
            -c 'Add :LSMinimumSystemVersion string 12.0' $A/Contents/Info.plist
          codesign --force --options runtime --timestamp -s "$APP_ID" $A
          codesign --verify --strict --verbose=2 $A
          pkgbuild --root root --install-location / --identifier $PKG_ID --version 1.0.$BUILD_NUMBER \
            --sign "$INS_ID" --timestamp out/FrondeskSignTest.pkg
          pkgutil --check-signature out/FrondeskSignTest.pkg
      - name: notarize + staple + spctl
        script: |
          set -euo pipefail
          K=$(mktemp -d)/asc.p8; printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > $K
          N=(--key $K --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --issuer "$APP_STORE_CONNECT_ISSUER_ID")
          xcrun notarytool submit out/FrondeskSignTest.pkg "${N[@]}" --wait --timeout 8m --output-format json | tee out/notary.json
          SID=$(plutil -extract id raw out/notary.json); ST=$(plutil -extract status raw out/notary.json)
          xcrun notarytool log "$SID" "${N[@]}" out/notary-log.json || true; cat out/notary-log.json || true
          rm -f $K; echo "NOTARY id=$SID status=$ST"; [ "$ST" = Accepted ]
          xcrun stapler staple out/FrondeskSignTest.pkg && xcrun stapler validate out/FrondeskSignTest.pkg
          spctl -a -vvv -t install out/FrondeskSignTest.pkg
          spctl -a -vv root/Applications/FrondeskSignTest.app
          root/Applications/FrondeskSignTest.app/Contents/MacOS/FrondeskSignTest
    artifacts:
      - out/FrondeskSignTest.pkg
      - out/notary*.json
